name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # weekly

permissions:
  contents: read
  # gitleaks-action читает PR через API — без pull-requests: read скан падает.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        # SECURITY/CI: action требует GITHUB_TOKEN при сканировании PR.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

