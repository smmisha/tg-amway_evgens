name: Amway Bot — Prepare Posts (Daytime Drafts)

on:
  schedule:
    # 07:00 UTC = 10:00 Kyiv (summer UTC+3) — morning prep
    # 09:00 UTC = 12:00 Kyiv (summer UTC+3) — midday prep
    # 13:00 UTC = 16:00 Kyiv (summer UTC+3) — afternoon prep
    - cron: '0 7,9,13 * * *'
  workflow_dispatch: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SECURITY (F-10): restore_state() в scripts/state_helpers.sh ходит в
    # artifacts API только GET-запросами (actions: read), но шаг
    # "Upload updated state" (actions/upload-artifact) — write: при понижении
    # до actions: read сохранение state падает с 403. Других прав нет.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore bot state (latest artifact)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source scripts/state_helpers.sh
          restore_state

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # SECURITY (TG-F-08): только полностью зафиксированные зависимости с хэшами.
        run: pip install --require-hashes -r requirements.lock

      - name: Prepare post draft (with 3 retries)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
             echo "Attempt $((n+1)) of 3..."
             python -m src.main --prepare && break
             n=$((n+1))
             sleep 15
          done
          if [ "$n" -ge 3 ]; then
             echo "All 3 preparation attempts failed."
             exit 1
          fi

      - name: Upload updated state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amway-state
          path: |
            data/published.json
            data/attempted.json
            data/prepared_posts.json
            data/last_update_id.txt
          if-no-files-found: ignore
          retention-days: 7
