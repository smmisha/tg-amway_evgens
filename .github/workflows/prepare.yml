name: Amway Bot — Prepare Posts (Daytime Drafts)

on:
  schedule:
    # 07:00 UTC = 10:00 Kyiv (summer UTC+3) — morning prep
    # 09:00 UTC = 12:00 Kyiv (summer UTC+3) — midday prep
    # 13:00 UTC = 16:00 Kyiv (summer UTC+3) — afternoon prep
    - cron: '0 7,9,13 * * *'
  workflow_dispatch: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot state (latest artifact)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source scripts/state_helpers.sh
          restore_state

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers & dependencies
        run: playwright install chromium --with-deps

      - name: Install Google Chrome Stable & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Prepare post draft (with 3 retries)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
             echo "Attempt $((n+1)) of 3..."
             xvfb-run -a python -m src.main --prepare && break
             n=$((n+1))
             sleep 15
          done
          if [ "$n" -ge 3 ]; then
             echo "All 3 preparation attempts failed."
             exit 1
          fi

      - name: Upload updated state
        uses: actions/upload-artifact@v4
        with:
          name: amway-state
          path: data/*.json
          if-no-files-found: ignore
          retention-days: 7
