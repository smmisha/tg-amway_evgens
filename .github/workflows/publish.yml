name: Amway Bot — Publish Posts

on:
  schedule:
    # Daily at 18:00 Kyiv time (15:00 UTC in summer UTC+3 / 16:00 UTC in winter UTC+2)
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SECURITY (F-10): restore_state() (GET artifacts API) требует только
    # actions: read, но шаг "Upload updated state" (actions/upload-artifact)
    # требует actions: write — иначе 403 и state не сохраняется между запусками.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore bot state (latest artifact)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source scripts/state_helpers.sh
          restore_state

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # SECURITY (TG-F-08): только полностью зафиксированные зависимости с хэшами.
        run: pip install --require-hashes -r requirements.lock

      - name: Publish post from prepared queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.main --publish-prepared


      - name: Upload updated state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amway-state
          path: |
            data/published.json
            data/attempted.json
            data/prepared_posts.json
            data/last_update_id.txt
          if-no-files-found: ignore
          retention-days: 7
