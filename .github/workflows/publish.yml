name: Amway Bot — Publish Posts

on:
  schedule:
    # Daily at 18:00 Kyiv time (15:00 UTC in summer UTC+3 / 16:00 UTC in winter UTC+2)
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot state (latest artifact)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source scripts/state_helpers.sh
          restore_state

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish post from prepared queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.main --publish-prepared


      - name: Upload updated state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amway-state
          path: data/*.json
          if-no-files-found: ignore
          retention-days: 7
