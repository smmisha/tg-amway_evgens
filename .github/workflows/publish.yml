name: Amway Bot — Publish Posts

on:
  schedule:
    # Daily at 18:00 Kyiv time (15:00 UTC in summer UTC+3 / 16:00 UTC in winter UTC+2)
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore bot state (latest artifact)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source scripts/state_helpers.sh
          restore_state

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers & dependencies
        run: playwright install chromium --with-deps

      - name: Install Google Chrome Stable & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Run Amway bot (Publish Prepared / Live)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Publishing post from prepared queue..."
          python -m src.main --publish-prepared


      - name: Upload updated state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amway-state
          path: data/*.json
          if-no-files-found: ignore
          retention-days: 7
