name: Amway Bot — Publish Posts

on:
  schedule:
    # Daily at 20:00 Kyiv time (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers & dependencies
        run: playwright install chromium --with-deps

      - name: Install Google Chrome Stable & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Run Amway bot (Publish Prepared / Live)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running scheduled publish from prepared queue..."
            python -m src.main --publish-prepared
          else
            echo "Running manual live pipeline execution..."
            xvfb-run -a python -m src.main
          fi

      - name: Commit updated published.json
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Amway Bot"
          git config user.email "bot@github.com"
          git add data/published.json data/attempted.json data/prepared_posts.json
          git diff --staged --quiet || git commit -m "Update published articles [skip ci]"
          git pull --rebase origin main || true
          if [ -n "$GH_PAT" ]; then
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            git push
          fi
