name: Anonymize data (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run anonymize script
        run: |
          python scripts/anonymize_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/*.json
            git commit -m "Anonymize data: replace PII with placeholders [skip ci]" || echo "no commit"
            git push
          else
            echo "No changes to commit"
          fi
