name: Bot Responder — Reply to /start

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx python-dotenv

      - name: Check and reply to messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=3
          delay=10
          until [ $attempts -ge $max_attempts ]
          do
            attempts=$((attempts+1))
            echo "Attempt $attempts of $max_attempts..."
            python -m src.responder && break || {
              rc=$?
              echo "Attempt $attempts failed with exit code $rc."
              if [ $attempts -lt $max_attempts ]; then
                echo "Sleeping $delay seconds before retry..."
                sleep $delay
                delay=$((delay*2))
              else
                echo "All attempts failed."
                exit $rc
              fi
            }
          done

      - name: Commit updated last_update_id
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Amway Bot"
          git config user.email "bot@github.com"
          git add data/last_update_id.txt
          git diff --staged --quiet || git commit -m "Update last_update_id [skip ci]"
          git pull --rebase origin main || true
          if [ -n "$GH_PAT" ]; then
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            git push
          fi
